services:
  caddy:
    build:
      context: .
      dockerfile: ./deploy/caddy/Dockerfile
    container_name: pe-be-caddy
    restart: unless-stopped
    # Only Caddyfile placeholders: a shared file would change Compose's config hash
    # (e.g. OTEL_SERVICE_VERSION) and recreate Caddy on every deploy.
    env_file:
      - ./backend/.env.caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Directory mount: rsync replaces files by rename, which a single-file mount would not see.
      - ./deploy/caddy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
      # Deploy-managed ACTIVE_BACKEND=backend-blue|backend-green; reread on every Caddy start.
      - ./config/active-backend.env:/etc/caddy-state/active-backend.env:ro
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile", "--envfile", "/etc/caddy-state/active-backend.env"]
    networks:
      - edge

  # Blue-green pair: deploys start the idle color, then Caddy switches to it.
  # See backend/deploy/blue-green.sh and RFC 0011.
  backend-blue: &backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pe-be-backend-blue
    restart: unless-stopped
    env_file:
      - ./backend/.env.production
    expose:
      - "8000"
    volumes:
      - exercise_images_data:/app/.exercise_images
      - chat_attachments_data:/app/.chat_attachments
      - workout_photos_data:/app/.workout_photos
    depends_on:
      db:
        condition: service_healthy
    networks:
      - edge
      - internal

  backend-green:
    <<: *backend
    container_name: pe-be-backend-green

  db:
    image: postgres:17-alpine
    container_name: pe-be-postgres
    restart: unless-stopped
    env_file:
      - ./backend/.env.production
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - max_connections=50
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - internal

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  exercise_images_data:
  chat_attachments_data:
  workout_photos_data:

networks:
  edge:
    driver: bridge
  internal:
    driver: bridge
