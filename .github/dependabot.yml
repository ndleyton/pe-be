version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/pe-be-tracker-frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # Sentry v11 needs an explicit dataCollection migration.
      - dependency-name: "@sentry/react"
        update-types: ["version-update:semver-major"]
      # Sentry v11 bundler plugin is a deliberate migration, not a routine bump.
      - dependency-name: "@sentry/vite-plugin"
        update-types: ["version-update:semver-major"]
      # jsdom 30.1.0 broke ExerciseTypesPage tests (window blur on focus); 30.1.3 is pinned.
      # Revisit minor bumps only after running ExerciseTypesPage.test.tsx.
      - dependency-name: "jsdom"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      frontend-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "uv"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      backend-dependencies:
        patterns:
          - "*"
